services:
  # mongo database
  mongodb:
    image: mongo:7
    restart: always
    container_name: mongodb-app
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_USERNAME: admin
      MONGO_INITDB_PASSWORD: test_pass
      # just use .env for security
    volumes:
      - mongo_data:/data/db
  # mongo express
  mongo-express-ui:
    image: mongo-express:latest
    restart: always
    container_name: mongo-express-ui
    ports:
      - "8081:8081"
    depends_on:
      - mongodb
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: test_pass
      ME_CONFIG_MONGODB_SERVER: mongodb
      # make sure to match credentials with mongodb
  # flask app
  flask-app:
    build: ./app
    container_name: flask-app
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    environment:
      MONGO_URL: mongodb://admin:test_pass@mongodb:27017/
      # access this env from the app

volumes:
  mongo_data:
