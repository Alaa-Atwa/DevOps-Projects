services:
  backend:
    build:
      context: ./backend
    container_name: node-app
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - DATABASE_URL=postgresql://admin:test_pass@database:5432/db
    depends_on:
      - database

    networks:
      - backend-net
      - frontend-net

  frontend:
    image: nginx
    container_name: nginx-reverse-proxy
    ports:
      - "8080:80"
    volumes:
      - ./frontend/index.html:/usr/share/nginx/html/index.html
      # - ./frontend/nginx/:/etc/nginx/conf.d/
    networks:
      - frontend-net
    depends_on:
      - backend

  database:
    image: postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: test_pass
      POSTGRES_DB: db
      POSTGRES_USER: admin
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - backend-net

volumes:
  postgres_data:

networks:
  backend-net:
  frontend-net:
